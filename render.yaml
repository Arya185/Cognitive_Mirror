services:
  - type: web
    name: cognitive-mirror
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: WATSONX_API_KEY
        sync: false
      - key: WATSONX_PROJECT_ID
        sync: false
      - key: WATSONX_SERVICE_URL
        value: https://eu-de.ml.cloud.ibm.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://cognitive-mirror-api.onrender.com

