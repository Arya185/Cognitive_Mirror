services:
  - type: web
    name: cognitive-mirror
    env: node
    plan: free

    buildCommand: npm install && npm run build
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3000

      - key: OPENROUTER_API_KEY
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        value: https://cognitive-mirror-six.vercel.app

      - key: VITE_API_BASE_URL
        value: https://cognitive-mirror-api.onrender.com
